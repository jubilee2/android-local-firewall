name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: native/outline-forwarder/go.sum

      - name: Ensure Android NDK 27.2.12479018
        run: |
          if [ ! -d "${ANDROID_HOME}/ndk/27.2.12479018" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
          fi

      - name: Verify Go module checksums and run lwip2transport race tests
        working-directory: native/outline-forwarder
        run: |
          go mod verify
          go test -v -race ./...

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint, and assemble debug + release APKs
        run: ./gradlew --no-daemon --stacktrace test lint assembleDebug assembleRelease

      - name: Verify packaged native ABIs and stage release bundle
        run: |
          PINNED_COMMIT="$(tr -d '[:space:]' < native/outline-forwarder/OUTLINE_SDK_COMMIT)"
          SHORT_COMMIT="${PINNED_COMMIT:0:12}"
          mkdir -p dist /tmp/extracted-release-jni

          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/android-local-firewall-release-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/android-local-firewall-debug.apk
          cp native/outline-forwarder/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

          for apk in dist/android-local-firewall-release-unsigned.apk dist/android-local-firewall-debug.apk; do
            unzip -l "${apk}" | grep -q "lib/arm64-v8a/liboutline_forwarder.so"
            unzip -l "${apk}" | grep -q "lib/x86_64/liboutline_forwarder.so"
            rm -rf /tmp/extracted-release-jni/*
            unzip -o "${apk}" "lib/*/liboutline_forwarder.so" -d /tmp/extracted-release-jni
            for so in /tmp/extracted-release-jni/lib/*/liboutline_forwarder.so; do
              go version -m "${so}" | grep -q "golang.getoutline.org/sdk.*-${SHORT_COMMIT}"
              go version -m "${so}" | grep -q "github.com/eycorsican/go-tun2socks"
            done
          done

          (
            cd dist
            sha256sum android-local-firewall-release-unsigned.apk android-local-firewall-debug.apk THIRD_PARTY_NOTICES.md > SHA256SUMS.txt
          )

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/android-local-firewall-release-unsigned.apk \
            dist/android-local-firewall-debug.apk \
            dist/THIRD_PARTY_NOTICES.md \
            dist/SHA256SUMS.txt \
            --title "Android Local Firewall ${GITHUB_REF_NAME}" \
            --generate-notes
