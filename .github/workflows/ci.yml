name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify native probe packaging and record size
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk 'lib/*/liboutline_forwarder_probe.so' | tee native-size-report.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/liboutline_forwarder_probe.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/liboutline_forwarder_probe.so'
          stat --printf='debug APK: %s bytes\n' app/build/outputs/apk/debug/app-debug.apk | tee -a native-size-report.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native size report
        uses: actions/upload-artifact@v7
        with:
          name: native-size-report
          path: native-size-report.txt
          if-no-files-found: error
